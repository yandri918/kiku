<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KikuLog — Today</title>
  <meta name="description" content="Work journal and schedule assistant for chrysanthemum farm workers." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body>
  <nav class="nav" id="main-nav">
    <a href="/" class="nav-logo" aria-label="KikuLog home">KikuLog</a>
    <ul class="nav-links">
      <li><a href="/" class="nav-link active" aria-current="page">Today</a></li>
      <li><a href="/journal" class="nav-link">Journal</a></li>
      <li><a href="/agenda" class="nav-link">Agenda</a></li>
      <li><a href="/evaluation" class="nav-link">Evaluation</a></li>
    </ul>
  </nav>

  <main class="main" id="main-content">
    <header class="page-header">
      <h1 class="page-title">Today</h1>
      <p class="page-subtitle" id="today-date"></p>
    </header>

    <section class="section" aria-labelledby="scheduled-heading">
      <h2 class="section-title" id="scheduled-heading">Scheduled Tasks</h2>
      <div class="task-list" id="scheduled-tasks">
        <p class="empty-state">Loading tasks...</p>
      </div>
    </section>

    <section class="section" aria-labelledby="overdue-heading">
      <h2 class="section-title" id="overdue-heading">Overdue</h2>
      <div class="task-list" id="overdue-tasks">
        <p class="empty-state">No overdue tasks.</p>
      </div>
    </section>

    <section class="section" aria-labelledby="windows-heading">
      <h2 class="section-title" id="windows-heading">Open Windows</h2>
      <p class="section-description">Tasks with a date range that includes today.</p>
      <div class="task-list" id="window-tasks">
        <p class="empty-state">No open windows today.</p>
      </div>
    </section>
  </main>

  <script src="/static/js/app.js?v=3"></script>
  <script>
    (function () {
      function init() {
        const { API, activityLabel, statusBadge, formatDate } = window.KikuLog || {};
        if (!API) return;

        const dateEl = document.getElementById('today-date');
        if (dateEl) {
          dateEl.textContent = new Date().toLocaleDateString('en-US', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
          });
        }

        async function loadTodayTasks() {
          const scheduledContainer = document.getElementById('scheduled-tasks');
          const overdueContainer = document.getElementById('overdue-tasks');
          const windowContainer = document.getElementById('window-tasks');

          try {
            const tasks = await API.get('/api/agenda/today');

            const overdue = tasks.filter(t => t.is_overdue);
            const windows = tasks.filter(t => t.is_window);
            const scheduled = tasks.filter(t => !t.is_overdue && !t.is_window);

            function renderTaskItem(t) {
              const dateStr = t.window_start === t.window_end
                ? formatDate(t.window_start)
                : `${formatDate(t.window_start)} – ${formatDate(t.window_end)}`;

              return `
                <div class="task-item">
                  <div>
                    <div class="task-activity">${activityLabel(t.activity)}</div>
                    <div class="task-meta">
                      <strong>${t.house_name}</strong> &nbsp;|&nbsp;
                      ${dateStr} &nbsp;|&nbsp;
                      <span style="font-size:0.75rem;color:var(--color-text-muted);">${t.source}</span>
                    </div>
                  </div>
                  <div>${statusBadge(t.status)}</div>
                </div>
              `;
            }

            if (scheduledContainer) {
              scheduledContainer.innerHTML = scheduled.length
                ? scheduled.map(renderTaskItem).join('')
                : '<p class="empty-state">No scheduled tasks for today.</p>';
            }

            if (overdueContainer) {
              overdueContainer.innerHTML = overdue.length
                ? overdue.map(renderTaskItem).join('')
                : '<p class="empty-state">No overdue tasks.</p>';
            }

            if (windowContainer) {
              windowContainer.innerHTML = windows.length
                ? windows.map(renderTaskItem).join('')
                : '<p class="empty-state">No open windows today.</p>';
            }

          } catch (err) {
            if (scheduledContainer) {
              scheduledContainer.innerHTML =
                `<p class="empty-state" style="color:var(--color-danger);">Failed to load agenda: ${err.message}</p>`;
            }
          }
        }

        loadTodayTasks();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
